<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">Modo claro</button>

  <h1 class="title">TETRIS</h1>

  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">-</span>
        </div>

        <div class="panel-section">
          <span class="label">ENERGY <span id="energy-hint" class="hint"></span></span>
          <div class="energy-bar" id="energy-bar"><div id="energy-fill"></div></div>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">HOLD <span id="hold-left" class="hint">-</span></span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>E</kbd> habilidad</li>
            <li><kbd>C</kbd> hold</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>M</kbd> sonido</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="ability-menu" class="overlay hidden">
      <div class="overlay-box">
        <p class="menu-title">HABILIDAD</p>
        <button class="ability-btn" data-ability="1"><kbd>1</kbd> Ver 5 piezas</button>
        <button class="ability-btn" data-ability="2"><kbd>2</kbd> Cambiar pieza</button>
        <button class="ability-btn" data-ability="3"><kbd>3</kbd> Ralentizar 10s</button>
        <button class="ability-btn" data-ability="4"><kbd>4</kbd> Deshacer</button>
        <button class="ability-btn" data-ability="5"><kbd>5</kbd> Reservar (hold)</button>
        <button id="ability-cancel" class="ability-btn secondary"><kbd>Esc</kbd> Cancelar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
